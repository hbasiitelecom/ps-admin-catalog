name: Construire les index

# L'analyse des sources se fait ici, une fois, et non sur chaque poste.
# L'application ne telecharge plus que le resultat, puis le script qu'elle lance.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources a indexer (ids separes par des virgules, vide = toutes)"
        required: false
      includeDisabled:
        description: "Indexer aussi les sources desactivees"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['catalog.json', 'tools/Build-SourceIndex.ps1', '.github/workflows/build-index.yml']
  schedule:
    # Lundi 04h00 UTC : les depots amont bougent de quelques scripts par semaine.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    name: Cloner, analyser, publier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write     # ecrit uniquement la branche « index », jamais main
    steps:
      - name: Recuperer la revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valider le catalogue avant d'indexer
        run: python3 tools/validate_catalog.py catalog.json --check-format

      - name: Construire les index
        shell: pwsh
        env:
          ONLY: ${{ inputs.sources }}
          INCLUDE_DISABLED: ${{ inputs.includeDisabled }}
        run: |
          # Table de hachage, pas un tableau : le splat d'un tableau lie les
          # arguments par position, et '-Catalog' devient alors une valeur.
          $p = @{ Catalog = 'catalog.json'; Out = 'index' }
          if ($env:ONLY -and $env:ONLY.Trim())  { $p.Only = $env:ONLY.Trim() }
          if ($env:INCLUDE_DISABLED -ne 'false') { $p.IncludeDisabled = $true }
          & ./tools/Build-SourceIndex.ps1 @p

      - name: Comparer a la construction precedente
        env:
          BRANCH: index
        run: |
          set -o pipefail
          if ! ls index/*.json >/dev/null 2>&1; then
            echo "::error::Aucun index construit : rien a comparer."
            exit 1
          fi
          # On extrait l'etat precedent AVANT de basculer sur la branche « index » :
          # apres la bascule, tools/ et catalog.json ne sont plus dans l'arbre.
          mkdir -p /tmp/index-precedent
          git fetch --depth 1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null; then
            git archive "refs/remotes/origin/$BRANCH" | tar -x -C /tmp/index-precedent
          fi
          python3 tools/comparer_index.py /tmp/index-precedent index --annoter

      - name: Publier sur la branche « index »
        env:
          BRANCH: index
        run: |
          set -o pipefail
          try() { if ! out=$("$@" 2>&1); then echo "::error::$* -> $out"; return 1; fi; echo "$out"; }

          # index/ est ignore sur main : c'est la presence des fichiers construits,
          # pas l'etat de l'index git, qui dit s'il y a quelque chose a publier.
          if ! ls index/*.json >/dev/null 2>&1; then
            echo "::error::Aucun index construit : rien a publier."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Les index sont un produit derive, pas le catalogue : ils ne vont pas sur
          # main. main reste protege, l'action n'y touche jamais et n'a besoin
          # d'aucune derogation.
          #
          # La branche « index » etait auparavant reecrite a chaque construction, en
          # orphelin pousse en force, pour que l'historique n'enfle pas. Le prix
          # etait lourd et il a ete paye le 27 septembre 2026 : apres un correctif,
          # le nombre de fiches marquees Obsolete est passe de 53 a 50 la ou
          # l'arithmetique en attendait 49, et « lesquelles ont change » etait sans
          # reponse, l'etat precedent n'existant plus.
          #
          # On construit donc PAR-DESSUS la branche existante, et on pousse sans
          # force. Cout reel : dix fichiers JSON, environ 1,2 Mo, par construction,
          # dont une par semaine par le declencheur horaire. Les ecarts d'une
          # semaine a l'autre sont minces et git les stocke en delta. Quelques Mo
          # par an, pour un historique du corpus semaine par semaine - ce qui vaut
          # bien plus que l'espace economise.
          git fetch --depth 1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null; then
            git checkout -B pub "refs/remotes/origin/$BRANCH"
            # Une source retiree du catalogue doit disparaitre de la branche.
            git rm -q --ignore-unmatch '*.json' || true
          else
            git checkout --orphan pub
            git reset -q
          fi
          mv index/*.json .
          for f in *.json; do
            [ "$f" = 'catalog.json' ] || git add -f "$f"
          done
          # Rien a publier quand rien n'a bouge : evite une revision vide par semaine.
          if git diff --cached --quiet; then
            echo "Aucun changement d'index : rien a publier."
            exit 0
          fi
          try git commit -m "chore(index): index construits depuis ${GITHUB_SHA:0:10}"
          try git push origin "HEAD:refs/heads/$BRANCH"
          echo "Publie sur la branche $BRANCH."
