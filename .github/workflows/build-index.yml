name: Construire les index

# L'analyse des sources se fait ici, une fois, et non sur chaque poste.
# L'application ne telecharge plus que le resultat, puis le script qu'elle lance.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources a indexer (ids separes par des virgules, vide = toutes)"
        required: false
      includeDisabled:
        description: "Indexer aussi les sources desactivees"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['catalog.json', 'tools/Build-SourceIndex.ps1', '.github/workflows/build-index.yml']
  schedule:
    # Lundi 04h00 UTC : les depots amont bougent de quelques scripts par semaine.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    name: Cloner, analyser, publier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # ecrit uniquement dans index/, sur une branche dediee
      pull-requests: write   # ouvre la demande de fusion et arme la fusion auto
    steps:
      - name: Recuperer la revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valider le catalogue avant d'indexer
        run: python3 tools/validate_catalog.py catalog.json --check-format

      - name: Construire les index
        shell: pwsh
        env:
          ONLY: ${{ inputs.sources }}
          INCLUDE_DISABLED: ${{ inputs.includeDisabled }}
        run: |
          # Table de hachage, pas un tableau : le splat d'un tableau lie les
          # arguments par position, et '-Catalog' devient alors une valeur.
          $p = @{ Catalog = 'catalog.json'; Out = 'index' }
          if ($env:ONLY -and $env:ONLY.Trim())  { $p.Only = $env:ONLY.Trim() }
          if ($env:INCLUDE_DISABLED -ne 'false') { $p.IncludeDisabled = $true }
          & ./tools/Build-SourceIndex.ps1 @p

      - name: Proposer la mise a jour des index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto/index
        run: |
          set -o pipefail
          # Toute erreur remonte en annotation : les journaux d'execution ne sont
          # pas toujours accessibles, une annotation l'est toujours.
          try() { if ! out=$("$@" 2>&1); then echo "::error::$* -> $out"; return 1; fi; echo "$out"; }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index
          if git diff --cached --quiet; then
            echo "Aucun changement : rien a publier."
            exit 0
          fi

          # main exige la validation du catalogue avant fusion, et le jeton de
          # l'action n'est pas administrateur : un push direct est refuse. On passe
          # donc par une demande de fusion, conclue automatiquement des que la
          # validation passe. La protection de branche reste entiere.
          git checkout -B "$BRANCH"
          try git commit -m "chore(index): reconstruction automatique des index"
          # Branche detenue par l'action seule : la reecrire est sans risque, et
          # --force-with-lease echoue faute de reference de suivi apres checkout -B.
          try git push --force origin "HEAD:refs/heads/$BRANCH"

          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // ""' || echo "")
          if [ -z "$open" ]; then
            if ! try gh pr create --base main --head "$BRANCH" \
                 --title "chore(index): reconstruction automatique des index" \
                 --body "Index reconstruits par l'action \`Construire les index\`. Seul \`index/\` change ; le catalogue n'est pas touche."; then
              echo "::error::Creation de la demande de fusion refusee. Verifier Settings > Actions > General > « Allow GitHub Actions to create and approve pull requests »."
              exit 1
            fi
          fi

          if ! gh pr merge "$BRANCH" --squash --auto --delete-branch 2>&1; then
            echo "::warning::Fusion automatique indisponible : la demande de fusion reste ouverte, a fusionner a la main."
          fi
